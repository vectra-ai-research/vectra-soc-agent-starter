id: flow_records
name: Flow Records (NetFlow Equivalent)
description: >-
  Provides a NetFlow-equivalent summary of network flow volume from Vectra's
  session telemetry. Reports total session counts, bytes transferred, and
  flow rate (sessions per minute) over the configured window. Breaks down
  flows by protocol and top source/destination pairs.

  Vectra's network.isession._all table is the Zeek conn.log equivalent —
  each row represents one completed IP session, analogous to a NetFlow v9
  or IPFIX record.
category: Network
version: "1.0"
parameters:
  - name: hours
    type: int
    description: Hours of history (1–72).
    default: 24
    required: false
data_sources:
  - id: summary_ds
    type: investigation_query
    query: |
      SELECT
        COUNT(*) AS total_flows,
        COUNT(DISTINCT id.orig_h) AS unique_sources,
        COUNT(DISTINCT id.resp_h) AS unique_destinations,
        SUM(orig_ip_bytes) AS total_bytes_sent,
        SUM(resp_ip_bytes) AS total_bytes_received
      FROM network.isession._all
      WHERE dt > date_add('hour', -{{ hours | int }}, now())
        AND timestamp BETWEEN date_add('hour', -{{ hours | int }}, now()) AND now()
    parameters: {}
    pagination:
      enabled: false
      max_pages: 1
      page_size: 10

  - id: proto_ds
    type: investigation_query
    query: |
      SELECT
        CASE
          WHEN service = 'unknown (unknown)' OR service IS NULL OR service = '' THEN 'Unknown'
          ELSE service
        END AS protocol,
        COUNT(*) AS flow_count,
        SUM(orig_ip_bytes) AS bytes_sent,
        SUM(resp_ip_bytes) AS bytes_received
      FROM network.isession._all
      WHERE dt > date_add('hour', -{{ hours | int }}, now())
        AND timestamp BETWEEN date_add('hour', -{{ hours | int }}, now()) AND now()
      GROUP BY 1
      ORDER BY flow_count DESC
      LIMIT 30
    parameters: {}
    pagination:
      enabled: false
      max_pages: 1
      page_size: 50

  - id: pair_ds
    type: investigation_query
    query: |
      SELECT
        id.orig_h AS src_ip,
        COALESCE(orig_hostname.name, id.orig_h) AS src_label,
        id.resp_h AS dst_ip,
        COALESCE(resp_hostname.name, id.resp_h) AS dst_label,
        COUNT(*) AS flow_count,
        SUM(orig_ip_bytes) AS bytes_sent,
        SUM(resp_ip_bytes) AS bytes_received
      FROM network.isession._all
      WHERE dt > date_add('hour', -{{ hours | int }}, now())
        AND timestamp BETWEEN date_add('hour', -{{ hours | int }}, now()) AND now()
      GROUP BY id.orig_h, orig_hostname.name, id.resp_h, resp_hostname.name
      ORDER BY flow_count DESC
      LIMIT 50
    parameters: {}
    pagination:
      enabled: false
      max_pages: 1
      page_size: 100

sections:
  - id: overview
    title: Overview
    type: summary
    data_source: summary_ds
    metrics:
      - label: Total Flows
        value_field: total_flows
        aggregation: sum
        format: number
      - label: Unique Sources
        value_field: unique_sources
        aggregation: sum
        format: number
      - label: Unique Destinations
        value_field: unique_destinations
        aggregation: sum
        format: number
      - label: Total Bytes Sent
        value_field: total_bytes_sent
        aggregation: sum
        format: bytes

  - id: proto_pie
    title: Flows by Protocol
    type: chart
    chart_type: pie
    data_source: proto_ds
    label_field: protocol
    value_field: flow_count
    empty_message: No flow data in this window.

  - id: proto_table
    title: Protocol Flow Summary
    type: table
    data_source: proto_ds
    columns:
      - field: protocol
        label: Protocol
        format: text
      - field: flow_count
        label: Flows
        format: number
      - field: bytes_sent
        label: Bytes Sent
        format: bytes
      - field: bytes_received
        label: Bytes Received
        format: bytes
    row_limit: 30
    empty_message: No flow data in this window.

  - id: pair_table
    title: Top Source / Destination Pairs
    type: table
    data_source: pair_ds
    columns:
      - field: src_ip
        label: Source IP
        format: ip
      - field: src_label
        label: Source Host
        format: text
      - field: dst_ip
        label: Dest IP
        format: ip
      - field: dst_label
        label: Dest Host
        format: text
      - field: flow_count
        label: Flows
        format: number
      - field: bytes_sent
        label: Bytes Sent
        format: bytes
      - field: bytes_received
        label: Bytes Received
        format: bytes
    row_limit: 50
    empty_message: No flow data in this window.

output:
  default_format: html
  title_template: "{{ name }} — last {{ hours }}h"
  include_metadata: true
