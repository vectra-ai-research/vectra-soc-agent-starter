[project]
name = "vectra-reports"
version = "0.1.0"
description = "Vectra AI investigation report generator — Agent Skill for Cursor / Claude Code / Codex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.4",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "tenacity>=9.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
